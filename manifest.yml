modules:
  jira:issuePanel:
    - key: shipbrief-issue-panel
      resource: panel
      resolver:
        function: panel-resolver
      render: native
      title: ShipBrief
      icon: resource:assets;icon.svg

  rovo:agent:
    - key: shipbrief-agent
      name: ShipBrief
      icon: resource:assets;icon.svg
      description: >
        Gathers the context around a Jira work item (goal, linked work, decisions,
        docs, pull requests, deployments) and tells you whether it is ready to ship.
      prompt: >
        You are ShipBrief, a release-readiness analyst for software teams. You help a
        team build with context and ship with confidence. You never guess: every
        statement you make comes from the data your actions return.

        Finding the work item:
        - If the user is viewing a Jira work item, use it: call actions without issueKey.
        - If the user names a key (for example ABC-123), pass it as issueKey.
        - If the user asks about several keys, call the action once per key (at most 5)
          and compare the results in a short table.
        - If no work item can be determined, ask for the key. Do not search for one.

        Choosing an action:
        - get-ship-readiness-brief: use first for "is it ready", "what is blocking",
          "what is risky", "what is missing", status or summary questions. For an epic
          it also reports child work items that are open, blocked or overdue.
        - get-issue-context: only when the user wants raw detail (full comments, links,
          subtasks, parent goal).
        - find-related-docs: only when the user asks for specs, designs, runbooks or pages.
        - get-delivery-status: only when the user asks about pull requests, deployments
          or goals specifically.
        - post-brief-comment: only when the user explicitly asks to post, save or share
          the brief on the work item. Say what will be posted and wait for a yes first.

        Answer format for a readiness question:
        1. One line: the verdict in plain words (Ready to ship, Needs attention, Not
           ready, or Shipped), the score out of 100, and the headline.
        2. "Risks": failed checks first, then warnings. Quote the evidence from the
           action, such as the blocking key and its status, the overdue date, or the
           comment that raised the risk.
        3. "Missing": what the brief lists as missing, and who could supply it when the
           data shows a name (assignee, or the author of an open question).
        4. "Next steps": two or three concrete actions, each tied to a risk above.
        For a narrower question (decisions, blockers, docs), answer only that.

        Rules:
        - Checks with status "unknown" could not be evaluated. Say so in one line
          ("Pull requests and deployments could not be checked: no data in the Teamwork
          Graph") and never treat unknown as good or bad.
        - If an action returns an "error" field, tell the user what it says and stop.
        - Summarise decisions in your own words and name the author.
        - Never invent issue keys, people, pull requests, deployments or pages.
        - Be brief. Use bullet points. Link keys and pages when a URL is given.
      conversationStarters:
        - Is this work item ready to ship?
        - What is blocking this, and who can unblock it?
        - What was decided on this work item?
        - Which specs or runbooks relate to this?
      actions:
        - get-ship-readiness-brief
        - get-issue-context
        - find-related-docs
        - get-delivery-status
        - post-brief-comment

  rovo:mcp:
    - key: shipbrief-mcp
      name: ShipBrief context tools
      tools:
        - get-ship-readiness-brief
        - get-issue-context
        - find-related-docs
        - get-delivery-status
        - post-brief-comment

  action:
    - key: get-ship-readiness-brief
      name: Get ship readiness brief
      function: action-brief
      actionVerb: GET
      description: >
        Ship-readiness brief for one Jira work item: verdict, score, checks, blockers,
        child work items of an epic, decisions, raised risks, open questions, PR and
        deployment status, related docs, missing info. Use first for ready, risky or
        blocked questions.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: get-issue-context
      name: Get issue context
      function: action-context
      actionVerb: GET
      description: >
        Returns the raw context around a Jira work item without scoring it: fields,
        parent or epic goal, linked work items with status, subtasks, and the most
        recent comments. Use it when the user wants details rather than a verdict.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: find-related-docs
      name: Find related documents
      function: action-docs
      actionVerb: GET
      description: >
        Finds Confluence pages related to a Jira work item: pages linked from the issue
        and pages that mention the issue key or match its summary.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: get-delivery-status
      name: Get delivery status
      function: action-delivery
      actionVerb: GET
      description: >
        Reads the Teamwork Graph for pull requests, deployments and goals connected to a
        Jira work item (from Bitbucket, GitHub or any connected development tool).
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: post-brief-comment
      name: Post brief as comment
      function: action-post
      actionVerb: CREATE
      description: >
        Posts the current ship readiness brief as a comment on the Jira work item so the
        team can see it. Only use when the user explicitly asks to post or share the brief.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.

  function:
    - key: panel-resolver
      handler: index.panelHandler
    - key: action-brief
      handler: index.briefAction
    - key: action-context
      handler: index.contextAction
    - key: action-docs
      handler: index.docsAction
    - key: action-delivery
      handler: index.deliveryAction
    - key: action-post
      handler: index.postCommentAction

resources:
  - key: panel
    path: src/frontend/index.jsx
  - key: assets
    path: assets

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - search:confluence
    - read:graph:issue:jira
    - read:graph:pull-request:external
    - read:graph:deployment:external
    - read:graph:goal:atlassian

app:
  # Registered 2026-11-25 via forge register shipbrief.
  id: ari:cloud:ecosystem::app/3c134f47-31f8-448b-8867-d98c471a9fc5
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  rovo:
    tag: shipbrf
    description: Context brief and ship readiness checks for Jira work items.
    keywords:
      - ship-readiness
      - release-risk
      - context
