modules:
  jira:issuePanel:
    - key: shipbrief-issue-panel
      resource: panel
      resolver:
        function: panel-resolver
      render: native
      title: ShipBrief
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg

  rovo:agent:
    - key: shipbrief-agent
      name: ShipBrief
      description: >
        Gathers the context around a Jira work item (goal, linked work, decisions,
        docs, pull requests, deployments) and tells you whether it is ready to ship.
      prompt: >
        You are ShipBrief, a release-readiness analyst for software teams.
        Your job is to help a team "build with context and ship with confidence".

        How to work:
        1. Identify the Jira work item. If the user is viewing an issue, use it and
           call the actions without an issueKey. If the user names a key (for example
           ABC-123), pass it as issueKey. If no work item can be determined, ask for the key.
        2. Call get-ship-readiness-brief first. It returns a verdict, a score, a list of
           checks (pass, warn, fail, unknown), blockers, decisions, open questions,
           delivery status and related documents.
        3. Only call get-issue-context, find-related-docs or get-delivery-status when the
           user asks for more detail on that specific area.
        4. Only call post-brief-comment when the user explicitly asks you to post, save or
           share the brief on the issue. Confirm with the user before posting.

        How to answer:
        - Start with the verdict and score in one line.
        - Then list risks (failed checks first, then warnings), each with the evidence
          returned by the action, such as the blocking issue key or the failed deployment.
        - Then list missing information, and say who could supply it when the data shows
          it (assignee, reporter, or the person who asked an open question).
        - Finish with two or three concrete next steps.
        - Summarise decisions found in comments in your own words and name the author.
        - Never invent issue keys, pull requests, deployments or pages. If an area is
          reported as unavailable or unknown, say that it could not be checked and why.
        - Keep it short. Use bullet points. Link issue keys and pages when URLs are given.
      conversationStarters:
        - Is this work item ready to ship?
        - Give me a context brief for this issue
        - What is blocking this from shipping?
        - Which decisions were made on this issue?
      actions:
        - get-ship-readiness-brief
        - get-issue-context
        - find-related-docs
        - get-delivery-status
        - post-brief-comment

  rovo:mcp:
    - key: shipbrief-mcp
      name: ShipBrief context tools
      tools:
        - get-ship-readiness-brief
        - get-issue-context
        - find-related-docs
        - get-delivery-status
        - post-brief-comment

  action:
    - key: get-ship-readiness-brief
      name: Get ship readiness brief
      function: action-brief
      actionVerb: GET
      description: >
        Produces a ship readiness brief for one Jira work item: verdict, score, checks
        (pass, warn, fail, unknown), open blockers, decisions and open questions from
        recent comments, pull request and deployment status, related Confluence pages
        and a list of missing information. Use this first for any question about
        whether a work item is ready, risky or blocked.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: get-issue-context
      name: Get issue context
      function: action-context
      actionVerb: GET
      description: >
        Returns the raw context around a Jira work item without scoring it: fields,
        parent or epic goal, linked work items with status, subtasks, and the most
        recent comments. Use it when the user wants details rather than a verdict.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: find-related-docs
      name: Find related documents
      function: action-docs
      actionVerb: GET
      description: >
        Finds Confluence pages related to a Jira work item: pages linked from the issue
        and pages that mention the issue key or match its summary.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: get-delivery-status
      name: Get delivery status
      function: action-delivery
      actionVerb: GET
      description: >
        Reads the Teamwork Graph for pull requests, deployments and goals connected to a
        Jira work item (from Bitbucket, GitHub or any connected development tool).
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.
    - key: post-brief-comment
      name: Post brief as comment
      function: action-post
      actionVerb: CREATE
      description: >
        Posts the current ship readiness brief as a comment on the Jira work item so the
        team can see it. Only use when the user explicitly asks to post or share the brief.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: Jira work item key such as ABC-123. Leave empty to use the issue the user is viewing.

  function:
    - key: panel-resolver
      handler: index.panelHandler
    - key: action-brief
      handler: index.briefAction
    - key: action-context
      handler: index.contextAction
    - key: action-docs
      handler: index.docsAction
    - key: action-delivery
      handler: index.deliveryAction
    - key: action-post
      handler: index.postCommentAction

resources:
  - key: panel
    path: src/frontend/index.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - search:confluence
    - read:graph:issue:jira
    - read:graph:pull-request:external
    - read:graph:deployment:external
    - read:graph:goal:atlassian

app:
  # Placeholder id. Run `forge register shipbrief` once (needs a Developer Space) to replace it.
  id: ari:cloud:ecosystem::app/00000000-0000-4000-8000-000000000000
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  rovo:
    tag: shipbrf
    description: Context brief and ship readiness checks for Jira work items.
    keywords:
      - ship-readiness
      - release-risk
      - context
